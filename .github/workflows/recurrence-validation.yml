name: Validar recorrências e regressão de medicação

on:
  push:
    branches:
      - feat/agenda-recorrencias-2026-11-16
      - feat/android-notifications-recurrence-2026-11-17
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verificar:
    name: Testes, lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Instalação com lockfile
        run: pnpm install --frozen-lockfile
      - name: Testes de calendário
        run: node --experimental-strip-types --test tests/recurrence.test.mjs
      - name: Testes de notificações Android
        run: pnpm test:notifications
      - name: Testes de estoque e regressão
        run: pnpm test:medication-control
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Sincronização nativa Android
        run: pnpm exec cap sync android

  apk-debug:
    name: Gerar APK Android de testes
    # Build isolado do PR #9. Nunca assina com chave de release nem publica
    # automaticamente na Play Store ou no ambiente web.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar frontend e sincronizar Android
        run: pnpm android:sync
      - name: Gerar APK de testes
        run: |
          cd android
          bash ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Conferir APK produzido
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk minha-medicacao-pr9-debug.apk
          sha256sum minha-medicacao-pr9-debug.apk > minha-medicacao-pr9-debug.apk.sha256
      - name: Publicar APK para download (ZIP do GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: minha-medicacao-pr9-android-debug
          path: |
            minha-medicacao-pr9-debug.apk
            minha-medicacao-pr9-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  apk-release:
    name: Disponibilizar APK debug (pré-release)
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 9 &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: apk-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Sem checkout e sem executar dependências de projeto neste job com
      # permissão de publicação; apenas baixar o artefato do job isolado.
      - name: Recuperar APK gerado
        uses: actions/download-artifact@v4
        with:
          name: minha-medicacao-pr9-android-debug
          path: release-files
      - name: Verificar hash do APK
        run: |
          set -euo pipefail
          cd release-files
          sha256sum -c minha-medicacao-pr9-debug.apk.sha256
          test -s minha-medicacao-pr9-debug.apk
      - name: Criar pré-release com download direto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="android-pr9-debug-${SOURCE_SHA:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/minha-medicacao-pr9-debug.apk release-files/minha-medicacao-pr9-debug.apk.sha256 --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" release-files/minha-medicacao-pr9-debug.apk release-files/minha-medicacao-pr9-debug.apk.sha256 \
              --repo "$GH_REPO" \
              --target "$SOURCE_SHA" \
              --title "Minha Medicação — Android PR #9 (APK debug de teste)" \
              --prerelease \
              --notes "APK de teste compilado automaticamente a partir do PR #9. Assinado com chave debug do CI; não é uma publicação na Play Store. Requer validação de notificações no aparelho e pode não atualizar instalações assinadas com outra chave. SHA-256 acompanha o arquivo."
          fi
          gh release view "$tag" --repo "$GH_REPO" --json tagName,assets,url
